<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GAMING | Klick-Challenge global</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #03050b);
            color: #eef;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: clamp(2rem, 7vw, 3.5rem);
            background: linear-gradient(135deg, #fff, #00eaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .click-card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 30px 20px;
            border: 1px solid #ffaa44;
            margin: 30px 0;
        }
        .name-input {
            padding: 12px 20px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            width: 220px;
            margin: 10px;
            background: #111;
            color: white;
        }
        .btn {
            background: linear-gradient(135deg, #8a2be2, #5a1a9e);
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 8px;
        }
        .btn:hover {
            transform: scale(1.05);
            background: #00eaff;
            color: black;
        }
        .click-btn {
            background: #ff6600;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            font-size: 2.5rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 30px #ff6600;
        }
        .click-btn:active { transform: scale(0.95); background: #ffaa00; }
        .timer { font-size: 2rem; font-family: monospace; background: #000000aa; display: inline-block; padding: 8px 25px; border-radius: 40px; margin: 10px; }
        .score-board { font-size: 1.5rem; margin: 10px; }
        .leaderboard { background: rgba(0,0,0,0.6); border-radius: 32px; padding: 20px; margin-top: 20px; text-align: left; }
        .leaderboard h3 { color: #ffaa44; text-align: center; margin-bottom: 15px; }
        .leaderboard ol { padding-left: 30px; }
        @media (max-width: 550px) { .click-btn { width: 140px; height: 140px; font-size: 1.8rem; } }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ KLICK-CHALLENGE ⚡</h1>
    <p>20 Sekunden – globale Bestenliste )</p>

    <div class="click-card">
        <div>
            <input type="text" id="playerName" class="name-input" placeholder="Dein Name" maxlength="20">
            <button id="startBtn" class="btn">START</button>
        </div>
        <div id="gamePanel" style="display: none;">
            <div class="timer" id="timerDisplay">20.0 s</div>
            <div class="score-board" id="clickScore">Klicks: 0</div>
            <div class="click-area">
                <button id="clickButton" class="click-btn">👆</button>
            </div>
            <button id="resetBtn" class="btn" style="background:#2c1a3a;">Zurück</button>
        </div>

        <div class="leaderboard">
            <h3>🏆 GLOBALE BESTENLISTE (Top 10)</h3>
            <ol id="leaderboardList"><li>Lade...</li></ol>
        </div>
    </div>
</div>

<script>
    const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbzj2eg9NINUK692grtQr7UE7R64Q5lcbEM8PP-IoYTqYDsp2OehUFjvYIgI6G8lgGJK_Q/exec";

    // DOM-Elemente
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const gamePanel = document.getElementById('gamePanel');
    const clickButton = document.getElementById('clickButton');
    const playerNameInput = document.getElementById('playerName');
    const timerDisplay = document.getElementById('timerDisplay');
    const clickScoreSpan = document.getElementById('clickScore');
    const leaderboardList = document.getElementById('leaderboardList');

    let clickCount = 0, timeLeft = 50, gameActive = false, countdownInterval = null;

    // --- Name im localStorage speichern und laden ---
    function loadSavedName() {
        const savedName = localStorage.getItem('clickChallengePlayerName');
        if (savedName) {
            playerNameInput.value = savedName;
        }
    }

    function saveName(name) {
        localStorage.setItem('clickChallengePlayerName', name);
    }

    // --- Bestenliste (unverändert) ---
    async function loadLeaderboard() {
        try {
            const res = await fetch(SHEETS_API_URL);
            const data = await res.json();
            renderLeaderboard(data);
        } catch(e) {
            console.error("Fehler beim Laden:", e);
            leaderboardList.innerHTML = '<li>Fehler beim Laden. Prüfe URL oder Netzwerk.</li>';
        }
    }

    function renderLeaderboard(entries) {
        leaderboardList.innerHTML = '';
        if (!entries || entries.length === 0) {
            leaderboardList.innerHTML = '<li>Noch keine Einträge. Sei der Erste!</li>';
            return;
        }
        entries.forEach((entry, idx) => {
            const li = document.createElement('li');
            li.textContent = `${idx+1}. ${entry.name}: ${entry.score} Klicks`;
            leaderboardList.appendChild(li);
        });
    }

    async function saveScore(name, score) {
        try {
            await fetch(SHEETS_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, score: score })
            });
            setTimeout(loadLeaderboard, 500);
        } catch(e) {
            console.error("Fehler beim Speichern:", e);
            alert("Score konnte nicht gespeichert werden.");
        }
    }

    // --- Spielstart (mit gespeichertem Namen) ---
    function startGame() {
        let name = playerNameInput.value.trim();
        if (name === "") {
            alert("Bitte gib deinen Namen ein!");
            return;
        }
        // Namen speichern für später
        saveName(name);
        
        // UI umschalten: Eingabefeld deaktivieren (aber nicht ausblenden)
        playerNameInput.disabled = true;
        startBtn.style.display = 'none';
        gamePanel.style.display = 'block';
        
        clickCount = 0;
        timeLeft = 50;
        gameActive = true;
        clickScoreSpan.innerText = `Klicks: 0`;
        timerDisplay.innerText = `50.0 s`;
        clickButton.disabled = false;

        if (countdownInterval) clearInterval(countdownInterval);
        const startTime = Date.now();
        countdownInterval = setInterval(() => {
            if (!gameActive) return;
            const elapsed = (Date.now() - startTime) / 1000;
            const remaining = Math.max(0, 50 - elapsed);
            timeLeft = remaining;
            timerDisplay.innerText = `${remaining.toFixed(1)} s`;
            if (remaining <= 0) {
                clearInterval(countdownInterval);
                endGame();
            }
        }, 100);
    }

    async function endGame() {
        if (!gameActive) return;
        gameActive = false;
        clickButton.disabled = true;
        clearInterval(countdownInterval);
        const finalScore = clickCount;
        const playerName = playerNameInput.value.trim();
        await saveScore(playerName, finalScore);
        alert(`Zeit vorbei! Du hast ${finalScore} Klicks.\nEintrag wurde zur globalen Bestenliste hinzugefügt.`);
        
        // Zurück zur Startansicht: Eingabefeld wieder aktivieren, START-Button einblenden
        gamePanel.style.display = 'none';
        playerNameInput.disabled = false;
        startBtn.style.display = 'inline-block';
    }

    function cancelGame() {
        if (countdownInterval) clearInterval(countdownInterval);
        gameActive = false;
        gamePanel.style.display = 'none';
        playerNameInput.disabled = false;
        startBtn.style.display = 'inline-block';
    }

    // --- Event-Listener ---
    clickButton.addEventListener('click', () => {
        if (gameActive && timeLeft > 0) {
            clickCount++;
            clickScoreSpan.innerText = `Klicks: ${clickCount}`;
            clickButton.style.transform = 'scale(0.95)';
            setTimeout(() => clickButton.style.transform = '', 100);
        }
    });
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', cancelGame);

    // --- Initialisierung: gespeicherten Namen laden, Bestenliste laden ---
    loadSavedName();
    loadLeaderboard();
    setInterval(loadLeaderboard, 3000);
</script>
</body>
</html>
